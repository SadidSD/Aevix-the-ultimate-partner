appId: com.aevix.assistant
productName: Aevix
copyright: "Copyright © 2025 Aevix"

directories:
  output: dist
  buildResources: assets

# Disable ASAR so dynamic import() and Express.static work on real files
asar: false

files:
  - "electron/**/*"
  - "public/**/*"
  - "index.js"
  - "agent.js"
  - "analytics.js"
  - "aw_client.js"
  - "prompts.js"
  - "classifications.json"
  - "tasks/**/*"
  - "system/**/*"
  - "skills/**/*"
  - "node_modules/**/*"
  - "package.json"
  # Exclude dev artifacts
  - "!.env"
  - "!.env.*"
  - "!*.db"
  - "!*.db-shm"
  - "!*.db-wal"
  - "!logs/**"
  - "!dist/**"
  - "!.github/**"
  - "!scripts/**"
  - "!scratch/**"
  - "!node_modules/.cache/**"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electron-rebuild/**"

# ActivityWatch binaries bundled alongside the app
extraResources:
  - from: "extraResources/activitywatch/"
    to: "activitywatch/"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: "assets/icon.ico"
  artifactName: "${productName}-Setup-${version}.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: "assets/icon.ico"
  uninstallerIcon: "assets/icon.ico"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Aevix"
  runAfterFinish: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: SadidSD
  repo: Aevix-the-ultimate-partner
  releaseType: release
