name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Download ActivityWatch binaries
        run: node scripts/download-activitywatch.cjs

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Create GitHub Release and upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $yml = Get-ChildItem dist\latest.yml | Select-Object -First 1
          $blockmap = Get-ChildItem dist\*.blockmap -ErrorAction SilentlyContinue | Select-Object -First 1
          $files = @($exe.FullName, $yml.FullName)
          if ($blockmap) { $files += $blockmap.FullName }
          gh release create $tag @files `
            --repo ${{ github.repository }} `
            --title "Aevix $tag" `
            --notes "Download **Aevix-Setup-$tag.exe** to install." `
            --latest
